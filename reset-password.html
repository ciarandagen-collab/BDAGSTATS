<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Coach Stats</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',-apple-system,sans-serif; background:#080f0b; color:#f0fdf4; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#0d2015; border:1px solid rgba(22,163,74,0.25); border-radius:20px; padding:32px 24px; max-width:360px; width:100%; }
  .logo { font-family:'Oswald',sans-serif; font-size:20px; font-weight:700; color:#16a34a; letter-spacing:2px; text-align:center; margin-bottom:24px; }
  .logo span { color:#f0fdf4; }
  h1 { font-size:20px; font-weight:700; color:#f0fdf4; text-align:center; margin-bottom:8px; }
  p { font-size:14px; color:rgba(240,253,244,0.5); text-align:center; margin-bottom:24px; }
  label { display:block; font-size:10px; letter-spacing:2px; color:rgba(240,253,244,0.45); text-transform:uppercase; font-family:'Oswald',sans-serif; margin-bottom:6px; }
  input { width:100%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:12px 14px; color:#f0fdf4; font-size:15px; outline:none; margin-bottom:16px; box-sizing:border-box; }
  input:focus { border-color:rgba(22,163,74,0.5); }
  button { width:100%; padding:14px; background:linear-gradient(135deg,#14532d,#16a34a); border:none; border-radius:10px; color:#fff; font-family:'Oswald',sans-serif; font-size:13px; font-weight:600; letter-spacing:2px; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .msg { padding:10px 14px; border-radius:8px; font-size:13px; text-align:center; margin-bottom:16px; display:none; }
  .msg.success { background:rgba(22,163,74,0.15); border:1px solid rgba(22,163,74,0.3); color:#86efac; }
  .msg.error { background:rgba(220,38,38,0.15); border:1px solid rgba(220,38,38,0.3); color:#fca5a5; }
  .back { display:block; text-align:center; margin-top:16px; font-size:13px; color:rgba(240,253,244,0.4); text-decoration:none; }
  .back:hover { color:#4ade80; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
</head>
<body>
<div class="card">
  <div class="logo">Coach <span>Stats</span></div>
  <h1>Reset Password</h1>
  <p>Enter your new password below</p>

  <div class="msg success" id="msg-success">Password updated — redirecting to app...</div>
  <div class="msg error" id="msg-error"></div>

  <div id="form-area">
    <label>New Password</label>
    <input type="password" id="new-password" placeholder="Minimum 6 characters" minlength="6">
    <label>Confirm Password</label>
    <input type="password" id="confirm-password" placeholder="Repeat your password">
    <button id="submit-btn" onclick="resetPassword()">Update Password</button>
  </div>

  <a href="/" class="back">← Back to app</a>
</div>

<script>
const SUPA_URL = 'https://sbruzfczhdooboxgsabs.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNicnV6ZmN6aGRvb2JveGdzYWJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzc3NTQsImV4cCI6MjA5NDg1Mzc1NH0.OrBC9OPtbDREjRB_daCvNHEtRvOJh7chxTDWEYSdIt8';

// Extract access token from URL hash
function getTokenFromHash() {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  return {
    accessToken: params.get('access_token'),
    type: params.get('type')
  };
}

async function resetPassword() {
  const { accessToken, type } = getTokenFromHash();
  const newPass = document.getElementById('new-password').value;
  const confirmPass = document.getElementById('confirm-password').value;
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('msg-error');
  const successEl = document.getElementById('msg-success');

  errEl.style.display = 'none';

  if (!newPass || newPass.length < 6) {
    errEl.textContent = 'Password must be at least 6 characters';
    errEl.style.display = 'block';
    return;
  }
  if (newPass !== confirmPass) {
    errEl.textContent = 'Passwords do not match';
    errEl.style.display = 'block';
    return;
  }
  if (!accessToken) {
    errEl.textContent = 'Invalid reset link. Please request a new one.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Updating...';

  try {
    const res = await fetch(SUPA_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + accessToken
      },
      body: JSON.stringify({ password: newPass })
    });
    const data = await res.json();

    if (data.error || res.status !== 200) {
      throw new Error(data.error || data.msg || 'Update failed');
    }

    document.getElementById('form-area').style.display = 'none';
    successEl.style.display = 'block';
    setTimeout(function() { window.location.href = '/'; }, 2000);

  } catch(err) {
    btn.disabled = false;
    btn.textContent = 'Update Password';
    errEl.textContent = err.message || 'Something went wrong. Please try again.';
    errEl.style.display = 'block';
  }
}

// Auto-detect if this is a recovery link
window.addEventListener('load', function() {
  const { type } = getTokenFromHash();
  if (!type || type !== 'recovery') {
    document.getElementById('msg-error').textContent = 'Invalid or expired reset link. Please request a new password reset from the app.';
    document.getElementById('msg-error').style.display = 'block';
    document.getElementById('form-area').style.display = 'none';
  }
});
</script>
</body>
</html>
