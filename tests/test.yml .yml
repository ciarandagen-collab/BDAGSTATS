name: Coach Stats Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  unit-tests:
    name: Unit Tests (Logic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run unit tests
        run: node tests/unit.test.js

  browser-tests:
    name: Browser Tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: List test files
        run: ls -la tests/

      - name: Wait for Netlify deployment
        run: sleep 60

      - name: Verify site is live
        run: curl -s -o /dev/null -w "%{http_code}" https://coachstats.netlify.app

      - name: Run browser tests
        run: npx playwright test --config=playwright.config.js
        env:
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload test report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
